<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Monitor — Nelson</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0b; --surface:#111113; --surface2:#18181c; --surface3:#1e1e24;
  --border:#222228; --border2:#2e2e38; --text:#f0f0f2; --muted:#6b6b7a;
  --accent:#e1306c; --accent2:#f77737; --accent3:#833ab4;
  --green:#22c55e; --gold:#f5c842; --blue:#38bdf8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
.container{max-width:1400px;margin:0 auto;padding:0 28px 80px;}
header{padding:36px 0 28px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.logo h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,4vw,56px);letter-spacing:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo p{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:4px;font-family:'JetBrains Mono',monospace;}
.header-right{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:right;line-height:1.9;}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.nav{display:flex;gap:4px;padding:20px 0 0;border-bottom:1px solid var(--border);}
.nav-btn{background:none;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--text);border-bottom-color:var(--accent);}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:2px;}
.controls{display:flex;gap:12px;padding:24px 0 20px;flex-wrap:wrap;align-items:flex-end;}
.control-group{display:flex;flex-direction:column;gap:6px;}
.control-label{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);}
select,input[type=date]{background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:8px 12px;cursor:pointer;outline:none;transition:border-color 0.2s;}
select:hover,input[type=date]:hover,select:focus,input[type=date]:focus{border-color:var(--accent);}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:28px;}
.stat-card{background:var(--surface);padding:18px 20px;transition:background 0.2s;}
.stat-card:hover{background:var(--surface2);}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;line-height:1;}
.stat-sub{font-size:10px;margin-top:3px;font-family:'JetBrains Mono',monospace;color:var(--muted);}
.type-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:28px;}
.type-card{background:var(--surface2);padding:16px 20px;}
.type-name{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;}
.type-count{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;}
.type-pct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px;}
.section-hdr{display:flex;align-items:center;gap:12px;margin:32px 0 16px;}
.section-hdr h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;}
.section-hdr .line{flex:1;height:1px;background:var(--border);}
.section-hdr .tag{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);border:1px solid var(--border2);padding:3px 8px;}
.posts-table{width:100%;border-collapse:collapse;font-size:12px;}
.posts-table thead tr{border-bottom:1px solid var(--border2);}
.posts-table th{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:10px 14px;text-align:left;font-weight:400;}
.posts-table tbody tr{border-bottom:1px solid var(--border);transition:background 0.15s;cursor:pointer;}
.posts-table tbody tr:hover{background:var(--surface2);}
.posts-table td{padding:12px 14px;vertical-align:middle;}
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:20px;}
.post-type{font-size:8px;font-family:'JetBrains Mono',monospace;letter-spacing:1px;padding:2px 6px;text-transform:uppercase;}
.type-Video{background:rgba(225,48,108,0.15);color:var(--accent);border:1px solid rgba(225,48,108,0.3);}
.type-Image{background:rgba(247,119,55,0.12);color:var(--accent2);border:1px solid rgba(247,119,55,0.25);}
.type-Sidecar{background:rgba(131,58,180,0.15);color:#c084fc;border:1px solid rgba(131,58,180,0.3);}
.num-cell{font-family:'JetBrains Mono',monospace;font-size:12px;}
.num-big{font-family:'Bebas Neue',sans-serif;font-size:18px;}
.caption-cell{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11px;}
.date-cell{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:768px){.compare-grid{grid-template-columns:1fr;}}
.compare-col{background:var(--surface);border:1px solid var(--border);padding:20px;}
.compare-col-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.compare-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;background:#1a1a2e;position:relative;flex-shrink:0;}
.compare-avatar::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));z-index:-1;}
.compare-handle{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;}
.compare-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-bottom:16px;}
.compare-stat{background:var(--bg);padding:12px 14px;}
.compare-stat .cs-label{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.compare-stat .cs-value{font-family:'Bebas Neue',sans-serif;font-size:22px;margin-top:2px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-label{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);width:90px;flex-shrink:0;}
.bar-bg{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width 1s ease;}
.bar-val{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text);width:50px;text-align:right;}
.profile-hero{display:flex;align-items:center;gap:20px;padding:20px;background:var(--surface);border:1px solid var(--border);margin-bottom:20px;}
.profile-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;background:#1a1a2e;position:relative;flex-shrink:0;}
.profile-avatar::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));z-index:-1;}
.profile-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;}
.profile-handle{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
.profile-followers{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green);margin-top:4px;}
footer{border-top:1px solid var(--border);padding:20px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:60px;}
footer p{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
.ig-grad{background:linear-gradient(135deg,var(--accent3),var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
a{color:inherit;text-decoration:none;}a:hover{color:var(--accent);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp 0.4s ease both;}
</style>
</head>
<body>
<div class="container">

<header>
  <div class="logo">
    <h1>Instagram Monitor</h1>
    <p>Influencer & Brand Tracker — Datos en vivo</p>
  </div>
  <div class="header-right">
    <div><span class="live-dot"></span><span id="update-time">Cargando...</span></div>
    <div id="header-stats">—</div>
  </div>
</header>

<div class="nav">
  <button class="nav-btn active" onclick="setView('cuenta',this)">📊 Por Cuenta</button>
  <button class="nav-btn" onclick="setView('comparar',this)">⚡ Comparar</button>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Cargando datos...</p>
</div>

<div id="app" style="display:none">

  <!-- VISTA POR CUENTA -->
  <div id="view-cuenta">
    <div class="controls">
      <div class="control-group">
        <div class="control-label">Cuenta</div>
        <select id="sel-cuenta" onchange="renderCuenta()">
          <option value="lt7noticias">@lt7noticias</option>
          <option value="ferpleyok">@ferpleyok</option>
          <option value="radiodos993">@radiodos993</option>
          <option value="radiosudamericana">@radiosudamericana</option>
        </select>
      </div>
      <div class="control-group">
        <div class="control-label">Desde</div>
        <input type="date" id="fecha-desde" value="2026-01-01" onchange="renderCuenta()">
      </div>
      <div class="control-group">
        <div class="control-label">Hasta</div>
        <input type="date" id="fecha-hasta" onchange="renderCuenta()">
      </div>
    </div>
    <div id="cuenta-content" class="fade-in"></div>
  </div>

  <!-- VISTA COMPARAR -->
  <div id="view-comparar" style="display:none">
    <div class="controls">
      <div class="control-group">
        <div class="control-label">Cuenta A</div>
        <select id="sel-cmp-a" onchange="renderComparar()">
          <option value="lt7noticias">@lt7noticias</option>
          <option value="ferpleyok">@ferpleyok</option>
          <option value="radiodos993">@radiodos993</option>
          <option value="radiosudamericana">@radiosudamericana</option>
        </select>
      </div>
      <div class="control-group">
        <div class="control-label">Cuenta B</div>
        <select id="sel-cmp-b" onchange="renderComparar()">
          <option value="lt7noticias">@lt7noticias</option>
          <option value="ferpleyok" selected>@ferpleyok</option>
          <option value="radiodos993">@radiodos993</option>
          <option value="radiosudamericana">@radiosudamericana</option>
        </select>
      </div>
      <div class="control-group">
        <div class="control-label">Desde</div>
        <input type="date" id="cmp-desde" value="2026-01-01" onchange="renderComparar()">
      </div>
      <div class="control-group">
        <div class="control-label">Hasta</div>
        <input type="date" id="cmp-hasta" onchange="renderComparar()">
      </div>
    </div>
    <div id="comparar-content" class="fade-in"></div>
  </div>

</div>

<footer>
  <p>INSTAGRAM MONITOR v3.0 &nbsp;·&nbsp; <span class="ig-grad">Datos reales · 7am diario</span></p>
  <p>© 2026 · Apify + Google Sheets</p>
</footer>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQeiMF1e6Qc9FVTq2XIWABF73STQxUkSoAD_1gjkteX2Z6r4L0HXq1VUbcItb2tZW1lMD4hOeZxk7VL/pub?gid=792720783&single=true&output=csv';

const PERFILES = {
  lt7noticias:       { seguidores: 131450, nombre: 'LT7 Noticias' },
  ferpleyok:         { seguidores: 10311,  nombre: 'Ferpley' },
  radiodos993:       { seguidores: 231500, nombre: 'Radio Dos S.R.L.' },
  radiosudamericana: { seguidores: 343250, nombre: 'Radio Sudamericana' }
};

const CUENTAS = ['lt7noticias','ferpleyok','radiodos993','radiosudamericana'];
const RANK_COLORS = ['var(--gold)','#aaa','#cd7f32'];
let TODOS = [];

async function cargarDatos() {
  try {
    const res  = await fetch(SHEET_URL + '&t=' + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) { mostrarError('Sin datos.'); return; }

    TODOS = rows.slice(1)
      .filter(r => r[0] && r[0] !== 'FECHA' && r[0] !== 'timestamp')
      .map(r => ({
        fecha:      r[0]||'',
        tipo:       r[1]||'',
        caption:    r[2]||'',
        likes:      parseInt(r[3])||0,
        comentarios:parseInt(r[4])||0,
        views:      parseInt(r[5])||0,
        url:        r[7]||'',
        cuenta:     (r[8]||'').toLowerCase().trim()
      }))
      .filter(p => CUENTAS.includes(p.cuenta));

    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fecha-hasta').value = hoy;
    document.getElementById('cmp-hasta').value   = hoy;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display     = 'block';

    const ahora = new Date();
    document.getElementById('update-time').textContent =
      'Datos al: ' + ahora.toLocaleDateString('es-AR') + ' ' +
      ahora.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('header-stats').textContent = 'Total posts cargados: ' + TODOS.length;

    renderCuenta();
  } catch(e) {
    mostrarError('Error: ' + e.message);
  }
}

function parseCSV(text) {
  const rows = [];
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    const cols=[]; let cur=''; let inQ=false;
    for (const c of line) {
      if (c==='"') inQ=!inQ;
      else if (c===',' && !inQ){cols.push(cur);cur='';}
      else cur+=c;
    }
    cols.push(cur); rows.push(cols);
  }
  return rows;
}

function filtrarFecha(posts, desde, hasta) {
  return posts.filter(p => {
    const f = p.fecha.substring(0,10);
    if (desde && f < desde) return false;
    if (hasta && f > hasta) return false;
    return true;
  });
}

function renderCuenta() {
  const cuenta = document.getElementById('sel-cuenta').value;
  const desde  = document.getElementById('fecha-desde').value;
  const hasta  = document.getElementById('fecha-hasta').value;

  let posts = filtrarFecha(TODOS.filter(p => p.cuenta === cuenta), desde, hasta);
  const perfil = PERFILES[cuenta];

  const tL = posts.reduce((s,p)=>s+p.likes,0);
  const tC = posts.reduce((s,p)=>s+p.comentarios,0);
  const tV = posts.reduce((s,p)=>s+p.views,0);
  const aL = posts.length ? Math.round(tL/posts.length) : 0;
  const aC = posts.length ? Math.round(tC/posts.length) : 0;

  const videos   = posts.filter(p=>p.tipo==='Video');
  const imagenes = posts.filter(p=>p.tipo==='Image');
  const sidecars = posts.filter(p=>p.tipo==='Sidecar');
  const top10    = [...posts].sort((a,b)=>b.likes-a.likes).slice(0,10);

  document.getElementById('cuenta-content').innerHTML = `
    <div class="profile-hero">
      <div class="profile-avatar">${cuenta[0].toUpperCase()}</div>
      <div>
        <div class="profile-name">@${cuenta}</div>
        <div class="profile-handle">${perfil.nombre}</div>
        <div class="profile-followers">👥 ${fmt(perfil.seguidores)} seguidores</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Posts</div><div class="stat-value">${posts.length}</div><div class="stat-sub">en el período</div></div>
      <div class="stat-card"><div class="stat-label">Likes totales</div><div class="stat-value" style="color:var(--accent)">${fmt(tL)}</div><div class="stat-sub">acumulados</div></div>
      <div class="stat-card"><div class="stat-label">Comentarios</div><div class="stat-value">${fmt(tC)}</div><div class="stat-sub">acumulados</div></div>
      <div class="stat-card"><div class="stat-label">Views totales</div><div class="stat-value" style="color:var(--green)">${fmt(tV)}</div><div class="stat-sub">en videos</div></div>
      <div class="stat-card"><div class="stat-label">Prom. likes</div><div class="stat-value" style="color:var(--accent2)">${fmt(aL)}</div><div class="stat-sub">por post</div></div>
      <div class="stat-card"><div class="stat-label">Prom. coment.</div><div class="stat-value">${fmt(aC)}</div><div class="stat-sub">por post</div></div>
    </div>

    <div class="section-hdr"><h2>Tipos de contenido</h2><div class="line"></div><div class="tag">${posts.length} posts</div></div>
    <div class="type-row">
      <div class="type-card">
        <div class="type-name">🎬 Reels / Video</div>
        <div class="type-count" style="color:var(--accent)">${videos.length}</div>
        <div class="type-pct">${posts.length?Math.round(videos.length/posts.length*100):0}% del total</div>
      </div>
      <div class="type-card">
        <div class="type-name">📷 Imagen</div>
        <div class="type-count" style="color:var(--accent2)">${imagenes.length}</div>
        <div class="type-pct">${posts.length?Math.round(imagenes.length/posts.length*100):0}% del total</div>
      </div>
      <div class="type-card">
        <div class="type-name">🖼️ Carrusel</div>
        <div class="type-count" style="color:#c084fc">${sidecars.length}</div>
        <div class="type-pct">${posts.length?Math.round(sidecars.length/posts.length*100):0}% del total</div>
      </div>
    </div>

    <div class="section-hdr"><h2>Top 10 Posts</h2><div class="line"></div><div class="tag">por likes · clic para abrir</div></div>
    <div style="overflow-x:auto">
      <table class="posts-table">
        <thead><tr>
          <th>#</th><th>Tipo</th><th>Caption</th>
          <th>Likes</th><th>Comentarios</th><th>Views</th><th>Fecha</th><th></th>
        </tr></thead>
        <tbody>
          ${top10.length ? top10.map((p,i)=>`
            <tr onclick="window.open('${p.url}','_blank')">
              <td class="rank-num" style="color:${RANK_COLORS[i]||'var(--muted)'}">${String(i+1).padStart(2,'0')}</td>
              <td><span class="post-type type-${p.tipo}">${p.tipo}</span></td>
              <td class="caption-cell">${(p.caption||'Sin caption').substring(0,55)}${(p.caption||'').length>55?'...':''}</td>
              <td class="num-big" style="color:var(--accent)">${fmt(p.likes)}</td>
              <td class="num-cell">${fmt(p.comentarios)}</td>
              <td class="num-cell" style="color:${p.views?'var(--green)':'var(--muted)'}">${p.views?fmt(p.views):'—'}</td>
              <td class="date-cell">${p.fecha.substring(0,10)}</td>
              <td><a href="${p.url}" target="_blank" onclick="event.stopPropagation()" style="color:var(--accent);font-size:10px;font-family:'JetBrains Mono',monospace">→ Ver</a></td>
            </tr>
          `).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:40px;font-family:\'JetBrains Mono\',monospace;font-size:11px">Sin posts en este período</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function calcStats(cuenta, desde, hasta) {
  const posts = filtrarFecha(TODOS.filter(p => p.cuenta === cuenta), desde, hasta);
  const tL = posts.reduce((s,p)=>s+p.likes,0);
  const tC = posts.reduce((s,p)=>s+p.comentarios,0);
  const tV = posts.reduce((s,p)=>s+p.views,0);
  return {
    posts, n: posts.length, tL, tC, tV,
    aL: posts.length ? Math.round(tL/posts.length) : 0,
    aC: posts.length ? Math.round(tC/posts.length) : 0,
    videos:   posts.filter(p=>p.tipo==='Video').length,
    imagenes: posts.filter(p=>p.tipo==='Image').length,
    sidecars: posts.filter(p=>p.tipo==='Sidecar').length,
    seguidores: PERFILES[cuenta].seguidores
  };
}

function renderComparar() {
  const cA    = document.getElementById('sel-cmp-a').value;
  const cB    = document.getElementById('sel-cmp-b').value;
  const desde = document.getElementById('cmp-desde').value;
  const hasta = document.getElementById('cmp-hasta').value;
  const sA    = calcStats(cA, desde, hasta);
  const sB    = calcStats(cB, desde, hasta);

  document.getElementById('comparar-content').innerHTML = `
    <div class="compare-grid">
      ${colComparar(cA, sA, sB)}
      ${colComparar(cB, sB, sA)}
    </div>
  `;
}

function colComparar(cuenta, s, rival) {
  const perfil = PERFILES[cuenta];
  const maxL   = Math.max(s.aL, rival.aL) || 1;
  const maxC   = Math.max(s.aC, rival.aC) || 1;
  const maxSeg = Math.max(s.seguidores, rival.seguidores) || 1;
  const top5   = [...s.posts].sort((a,b)=>b.likes-a.likes).slice(0,5);

  return `
    <div class="compare-col">
      <div class="compare-col-header">
        <div class="compare-avatar">${cuenta[0].toUpperCase()}</div>
        <div>
          <div class="compare-handle">@${cuenta}</div>
          <div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace">${perfil.nombre}</div>
        </div>
      </div>

      <div class="compare-stats">
        <div class="compare-stat"><div class="cs-label">Seguidores</div><div class="cs-value" style="color:var(--green)">${fmt(s.seguidores)}</div></div>
        <div class="compare-stat"><div class="cs-label">Posts</div><div class="cs-value">${s.n}</div></div>
        <div class="compare-stat"><div class="cs-label">Total Likes</div><div class="cs-value" style="color:var(--accent)">${fmt(s.tL)}</div></div>
        <div class="compare-stat"><div class="cs-label">Total Views</div><div class="cs-value" style="color:var(--blue)">${fmt(s.tV)}</div></div>
        <div class="compare-stat"><div class="cs-label">Prom. Likes</div><div class="cs-value" style="color:${s.aL>=rival.aL?'var(--gold)':'var(--text)'}">${fmt(s.aL)} ${s.aL>=rival.aL?'🏆':''}</div></div>
        <div class="compare-stat"><div class="cs-label">Prom. Coment</div><div class="cs-value" style="color:${s.aC>=rival.aC?'var(--gold)':'var(--text)'}">${fmt(s.aC)} ${s.aC>=rival.aC?'🏆':''}</div></div>
      </div>

      <div style="margin-bottom:16px">
        <div class="bar-row"><div class="bar-label">Seguidores</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.round(s.seguidores/maxSeg*100)}%;background:var(--green)"></div></div><div class="bar-val">${fmt(s.seguidores)}</div></div>
        <div class="bar-row"><div class="bar-label">Prom. likes</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.round(s.aL/maxL*100)}%;background:var(--accent)"></div></div><div class="bar-val">${fmt(s.aL)}</div></div>
        <div class="bar-row"><div class="bar-label">Prom. coment</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.round(s.aC/maxC*100)}%;background:var(--accent2)"></div></div><div class="bar-val">${fmt(s.aC)}</div></div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);margin-bottom:16px">
        <div style="background:var(--bg);padding:10px 12px;text-align:center"><div style="font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1px">VIDEO</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent)">${s.videos}</div></div>
        <div style="background:var(--bg);padding:10px 12px;text-align:center"><div style="font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1px">IMAGEN</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent2)">${s.imagenes}</div></div>
        <div style="background:var(--bg);padding:10px 12px;text-align:center"><div style="font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1px">CARRUSEL</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#c084fc">${s.sidecars}</div></div>
      </div>

      <div class="section-hdr" style="margin-top:16px"><h2>Top 5 Posts</h2><div class="line"></div></div>
      <div style="overflow-x:auto">
        <table class="posts-table">
          <thead><tr><th>#</th><th>Tipo</th><th>Likes</th><th>Coment.</th><th>Views</th><th>Fecha</th></tr></thead>
          <tbody>
            ${top5.length ? top5.map((p,i)=>`
              <tr onclick="window.open('${p.url}','_blank')">
                <td class="rank-num" style="color:${RANK_COLORS[i]||'var(--muted)'}">${i+1}</td>
                <td><span class="post-type type-${p.tipo}">${p.tipo}</span></td>
                <td class="num-big" style="color:var(--accent)">${fmt(p.likes)}</td>
                <td class="num-cell">${fmt(p.comentarios)}</td>
                <td class="num-cell" style="color:${p.views?'var(--green)':'var(--muted)'}">${p.views?fmt(p.views):'—'}</td>
                <td class="date-cell">${p.fecha.substring(0,10)}</td>
              </tr>
            `).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;font-size:11px">Sin posts</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function setView(vista, btn) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-cuenta').style.display   = vista==='cuenta'   ? 'block':'none';
  document.getElementById('view-comparar').style.display = vista==='comparar' ? 'block':'none';
  if (vista==='comparar') renderComparar();
}

function fmt(n) {
  if(!n)return'0';
  if(n>=1000000)return(n/1000000).toFixed(1)+'M';
  if(n>=1000)return(n/1000).toFixed(1)+'K';
  return n.toString();
}

function mostrarError(msg) {
  document.getElementById('loading').innerHTML =
    `<div style="text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px">
      <div style="font-size:32px;margin-bottom:12px">⚠️</div>${msg}
    </div>`;
}

cargarDatos();
</script>
</body>
</html>
